<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jyangbly iOS · Home</title>
    <link rel="stylesheet" href="../css/demo.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <main class="ios-stage">
      <header class="ios-top">
        <div>
          <span class="eyebrow">live space</span>
          <h1 class="phone-title">Jyangbly</h1>
        </div>
        <button class="brand-orb" type="button" aria-label="Jyangbly signal">
          J
        </button>
      </header>

      <section class="ios-content">
        <article class="phone-panel phone-hero">
          <span class="chip hot">black glass beta</span>
          <h1>你的个人主页可以像 App 一样被打开。</h1>
          <p>动态、收藏、博客和匿名提问全部变成移动端一眼能懂的核心入口。</p>
        </article>

        <div class="mini-row">
          <article class="mini-card">
            <span>today signal</span><strong>42</strong>
          </article>
          <article class="mini-card">
            <span>active rooms</span><strong>4</strong>
          </article>
        </div>

        <article class="post featured">
          <div class="post-top">
            <span class="chip hot">featured</span><span>2 min</span>
          </div>
          <h3>把主页做成能逛的社交空间。</h3>
          <p>黑色底、玻璃层和发光轨道只是外壳，真正重要的是访客能参与。</p>
          <div class="post-actions">
            <button class="like-button" type="button" data-like>
              喜欢 <span data-like-count>18</span>
            </button>
            <span class="chip">评论 6</span>
          </div>
        </article>

        <section class="signal-game glass" data-signal-game>
          <h2>轻量彩蛋</h2>
          <p>点亮三个碎片，解锁 Signal Mode。</p>
          <div class="signal-buttons">
            <button class="signal-button" type="button" data-signal="A">
              A
            </button>
            <button class="signal-button" type="button" data-signal="B">
              B
            </button>
            <button class="signal-button" type="button" data-signal="C">
              C
            </button>
          </div>
          <div class="signal-status" data-signal-status>
            等待收集 0/3 个信号碎片
          </div>
        </section>
      </section>

      <nav class="phone-nav" aria-label="iOS navigation">
        <a aria-current="page" href="ios-home.html">动态</a>
        <a href="ios-likes.html">Likes</a>
        <a href="ios-blog.html">博客</a>
        <a href="ios-ask.html">提问</a>
      </nav>
    </main>
    <script src="../js/demo.js"></script>
  </body>
</html>
