<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 840" role="img" aria-labelledby="title desc">
  <title id="title">Beau Butler IMDb profile card</title>
  <desc id="desc">A text-only profile card used when a verified portrait image is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2a2428"/>
      <stop offset="0.55" stop-color="#46323c"/>
      <stop offset="1" stop-color="#171217"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f2d5b5"/>
      <stop offset="1" stop-color="#b78568"/>
    </linearGradient>
  </defs>
  <rect width="600" height="840" fill="url(#bg)"/>
  <rect x="54" y="64" width="492" height="712" rx="34" fill="none" stroke="#f2d5b5" stroke-opacity="0.34" stroke-width="2"/>
  <circle cx="300" cy="228" r="74" fill="#f2d5b5" fill-opacity="0.12" stroke="#f2d5b5" stroke-opacity="0.45" stroke-width="2"/>
  <text x="300" y="242" text-anchor="middle" fill="#f2d5b5" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">BB</text>
  <rect x="132" y="366" width="336" height="4" rx="2" fill="url(#line)"/>
  <text x="300" y="456" text-anchor="middle" fill="#fff4e7" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">Beau Butler</text>
  <text x="300" y="514" text-anchor="middle" fill="#dcc0a9" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="3">IMDb PROFILE</text>
  <text x="300" y="636" text-anchor="middle" fill="#bfa18a" font-family="Arial, Helvetica, sans-serif" font-size="18">verified portrait unavailable</text>
</svg>
