# Must match your existing Cloudflare Worker name (Dashboard → Workers & Pages).
name = "portfolio"
account_id = "cd77340c35e904beb65ed7a2dea6d21c"
main = "worker/index.ts"
compatibility_date = "2026-05-16"
workers_dev = true

# Custom domain: creates/updates DNS when you deploy with --domains jyangb1y.site
# Do not also attach jyangb1y.site on a Pages project (conflicts + can delete DNS).
routes = [
  { pattern = "jyangb1y.site", custom_domain = true },
]

[assets]
directory = "./build"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "GALLERY"
bucket_name = "portfolio-gallery"
preview_bucket_name = "portfolio-gallery"
